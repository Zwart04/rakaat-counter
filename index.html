<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rakaat Counter v7.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; fill: currentColor; }

        /* --- SETUP SCREEN --- */
        #setupScreen {
            display: flex; flex-direction: column;
            align-items: center; width: 100%; height: 100%;
            padding: 40px 20px; overflow-y: auto;
        }
        
        .logo-box { text-align: center; margin-bottom: 30px; }
        .logo-text { font-size: 32px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .logo-sub { font-size: 12px; color: #888; letter-spacing: 3px; margin-top: 5px; }

        .reminder-container { width: 100%; max-width: 350px; margin-bottom: 25px; }
        .reminder-item {
            background: #111; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 10px; font-size: 13px; color: #bbb;
            display: flex; align-items: flex-start; line-height: 1.4;
            border: 1px solid #222;
        }
        .reminder-item b { color: #f39c12; margin-right: 8px; }

        .section-label { 
            width: 100%; max-width: 350px; text-align: left;
            font-size: 11px; font-weight: 800; color: #555;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 10px; margin-top: 10px;
        }

        /* Gender Selector Tabs */
        .selector-group {
            display: flex; width: 100%; max-width: 350px;
            background: #111; border-radius: 14px; padding: 5px;
            margin-bottom: 20px; border: 1px solid #222;
        }
        .selector-btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            background: transparent; color: #666; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .selector-btn.active { background: #222; color: #fff; }
        .selector-btn .icon { margin-right: 8px; }

        .mute-toggle {
            width: 100%; max-width: 350px; padding: 15px;
            background: #111; border: 1px solid #222; border-radius: 14px;
            color: #fff; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 30px; cursor: pointer;
        }

        #startBtn {
            width: 100%; max-width: 350px; padding: 20px;
            background: #fff; color: #000; border: none; border-radius: 18px;
            font-size: 18px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
        }
        #startBtn .icon { fill: #000; margin-right: 12px; width: 24px; height: 24px; }

        /* --- APP SCREEN --- */
        #appScreen {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        #label { font-size: 14px; font-weight: 800; color: #444; letter-spacing: 8px; margin-bottom: -15px; }
        #rakaat { font-size: 60vw; font-weight: 800; }
        .status-pill { background: #111; padding: 8px 24px; border-radius: 100px; color: #888; font-size: 16px; font-weight: 600; border: 1px solid #222; }
        
        #resetBtn {
            position: absolute; bottom: 40px; padding: 12px 28px;
            background: transparent; color: #444; border: 1px solid #222;
            border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        video, canvas { display: none; }
    </style>
</head>
<body>

    <svg style="display:none;">
        <symbol id="i-female" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
        <symbol id="i-male" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
    </svg>

    <div id="setupScreen">
        <div class="logo-box">
            <div class="logo-text">Rakaat</div>
            <div class="logo-sub">AUTO DETECTOR</div>
        </div>

        <div class="reminder-container">
            <div class="reminder-item"><b>⚠️</b> Pastikan ruangan memiliki cahaya yang cukup agar sensor kamera bekerja akurat.</div>
            <div class="reminder-item"><b>⚠️</b> Aktifkan Mode Pesawat & Jangan Ganggu agar sholat tidak terganggu.</div>
        </div>

        <div class="section-label">Pilih Suara Pemandu</div>
        <div class="selector-group">
            <button class="selector-btn active" id="btnFemale"><svg class="icon"><use href="#i-female"></use></svg> Perempuan</button>
            <button class="selector-btn" id="btnMale"><svg class="icon"><use href="#i-male"></use></svg> Laki-Laki</button>
        </div>

        <div class="mute-toggle" id="muteToggle">
            <span>Suara Aktif</span>
            <input type="checkbox" id="muteCheck" checked style="width:20px; height:20px; accent-color:#fff;">
        </div>

        <button id="startBtn"><svg class="icon"><use href="#i-play"></use></svg> MULAI SHOLAT</button>
    </div>

    <div id="appScreen">
        <div id="label">RAKAAT</div>
        <div id="rakaat">1</div>
        <div class="status-pill" id="status">Sujud: 0</div>
        <button id="resetBtn">RESET HITUNGAN</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        let sujudCount = 0, rakaatCount = 1, isDark = false, isMuted = false, voiceGender = "female", wakeLock = null;
        const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        const rakaatTeks = document.getElementById('rakaat'), statusTeks = document.getElementById('status');

        // TTS
        let voices = [];
        const loadV = () => { voices = window.speechSynthesis.getVoices(); };
        window.speechSynthesis.onvoiceschanged = loadV; loadV();

        function bicara(teks) {
            if (isMuted) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(teks);
            msg.lang = 'id-ID'; msg.rate = 0.9;
            const idV = voices.filter(v => v.lang.includes('id') || v.lang.includes('in'));
            if (voiceGender === "female") { if (idV[0]) msg.voice = idV[0]; msg.pitch = 1.1; }
            else { if (idV[1]) msg.voice = idV[1]; else if (idV[0]) msg.voice = idV[0]; msg.pitch = 0.7; }
            window.speechSynthesis.speak(msg);
        }

        // Controls
        document.getElementById('btnFemale').onclick = () => { 
            voiceGender = "female"; 
            document.getElementById('btnFemale').classList.add('active');
            document.getElementById('btnMale').classList.remove('active');
            bicara("Suara perempuan");
        };
        document.getElementById('btnMale').onclick = () => { 
            voiceGender = "male"; 
            document.getElementById('btnMale').classList.add('active');
            document.getElementById('btnFemale').classList.remove('active');
            bicara("Suara laki-laki");
        };
        document.getElementById('muteToggle').onclick = () => {
            isMuted = !document.getElementById('muteCheck').checked;
            document.getElementById('muteCheck').checked = !isMuted;
        };

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                video.onloadedmetadata = () => { canvas.width = video.videoWidth; canvas.height = video.videoHeight; requestAnimationFrame(detect); };
                bicara("Mulai sholat");
            } catch(e) { alert("Kamera error: " + e.message); }
        }
        document.getElementById('startBtn').onclick = startApp;

        function detect() {
            if (video.paused || video.ended) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0, c = 0;
            for (let i = 0; i < d.length; i += 100) { t += (d[i] + d[i+1] + d[i+2]) / 3; c++; }
            const avg = t / c;
            if (avg < 25 && !isDark) { isDark = true; setTimeout(hit, 800); }
            else if (avg > 45 && isDark) isDark = false;
            setTimeout(() => requestAnimationFrame(detect), 300);
        }

        function hit() {
            sujudCount++; 
            if (navigator.vibrate) navigator.vibrate(200);
            statusTeks.innerText = "Sujud: " + sujudCount;
            if (sujudCount === 1) bicara("Sujud satu");
            else { 
                rakaatCount++; rakaatTeks.innerText = rakaatCount; bicara("Rakaat " + rakaatCount);
                sujudCount = 0; setTimeout(() => statusTeks.innerText = "Sujud: 0", 1000);
            }
        }

        document.getElementById('resetBtn').onclick = () => { sujudCount = 0; rakaatCount = 1; rakaatTeks.innerText = "1"; statusTeks.innerText = "Sujud: 0"; bicara("Reset"); };
    </script>
</body>
</html>
