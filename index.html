<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rakaat Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000; color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        i { width: 22px; height: 22px; display: inline-block; vertical-align: middle; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        i svg { width: 100%; height: 100%; }
        .icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }

        #setupScreen {
            display: flex; flex-direction: column;
            align-items: center; width: 100%; height: 100%;
            padding: 40px 20px; overflow-y: auto;
        }

        .logo-box { text-align: center; margin-bottom: 30px; }
        .logo-text { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
        .logo-sub { font-size: 11px; color: #666; letter-spacing: 4px; margin-top: 6px; text-transform: uppercase; }

        .reminder-container { width: 100%; max-width: 350px; margin-bottom: 20px; }
        .reminder-item {
            background: #0a0a0a; padding: 12px 14px; border-radius: 12px;
            margin-bottom: 8px; font-size: 13px; color: #999;
            display: flex; align-items: flex-start; gap: 10px; line-height: 1.4;
            border: 1px solid #1a1a1a;
        }
        .reminder-item .icon-emoji { font-size: 15px; flex-shrink: 0; }

        .section-label { 
            width: 100%; max-width: 350px; text-align: left;
            font-size: 11px; font-weight: 700; color: #444;
            letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 10px; margin-top: 14px;
        }

        .selector-group {
            display: flex; width: 100%; max-width: 350px;
            background: #0a0a0a; border-radius: 14px; padding: 4px;
            margin-bottom: 12px; border: 1px solid #1a1a1a;
        }
        .selector-btn {
            flex: 1; padding: 12px 8px; border: none; border-radius: 11px;
            background: transparent; color: #555; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .selector-btn.active { background: #fff; color: #000; }
        .selector-btn.active i { stroke: #000; }
        .selector-btn i { stroke: #555; width: 18px; height: 18px; }

        .option-row {
            width: 100%; max-width: 350px; padding: 14px 16px;
            background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; cursor: pointer;
        }
        .option-row span { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .option-row span i { stroke: currentColor; width: 18px; height: 18px; }

        .switch {
            width: 44px; height: 24px; background: #222;
            border-radius: 12px; position: relative; cursor: pointer;
            transition: background 0.3s; flex-shrink: 0;
        }
        .switch.on { background: #fff; }
        .switch::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; background: #666;
            border-radius: 50%; transition: all 0.3s;
        }
        .switch.on::after { left: 23px; background: #000; }

        #checkLightBtn {
            width: 100%; max-width: 350px; padding: 14px;
            background: #0a0a0a; border: 1px dashed #b8860b; border-radius: 14px;
            color: #b8860b; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; margin-bottom: 25px;
            transition: background 0.2s;
        }
        #checkLightBtn:active { background: #0d0d00; }
        #checkLightBtn i { stroke: #b8860b; }

        #startBtn {
            width: 100%; max-width: 350px; padding: 20px;
            background: #fff; color: #000; border: none; border-radius: 16px;
            font-size: 17px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 24px rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        #startBtn i { stroke: #000; }

        /* Light Modal */
        #lightModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            z-index: 100; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px;
        }
        #lightModal.show { display: flex; }
        .light-title { font-size: 17px; font-weight: 800; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; }
        .light-title i { width: 24px; height: 24px; }

        .light-bar-wrap { width: 100%; max-width: 280px; position: relative; margin-bottom: 10px; }

        .light-bar-bg {
            width: 100%; height: 16px; background: #1a1a1a;
            border-radius: 8px; overflow: hidden; position: relative;
        }
        .light-bar {
            height: 100%; width: 0%; border-radius: 8px;
            transition: width 0.2s, background 0.3s;
        }
        .light-bar-track {
            position: absolute; top: 0; left: 0; height: 100%; width: 100%;
            border-radius: 8px;
            background: linear-gradient(to right, #e74c3c 0%, #e74c3c 12.5%, #f39c12 12.5%, #f39c12 22.5%, #2ecc71 22.5%, #2ecc71 60%, #3498db 60%, #3498db 100%);
            opacity: 0.15;
        }

        .light-val { font-size: 36px; font-weight: 800; margin: 12px 0 4px; }
        .light-label { font-size: 14px; font-weight: 600; margin-bottom: 20px; text-align: center; line-height: 1.4; }
        .light-stop-btn {
            padding: 14px 36px; background: #1a1a1a; border: none;
            border-radius: 14px; color: #fff; font-size: 15px;
            font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        /* App Screen */
        #appScreen {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        #label { font-size: 13px; font-weight: 700; color: #333; letter-spacing: 10px; margin-bottom: -15px; text-transform: uppercase; }
        #rakaat { font-size: 55vw; font-weight: 800; letter-spacing: -4px; }
        .status-pill { background: #0a0a0a; padding: 8px 24px; border-radius: 100px; color: #777; font-size: 15px; font-weight: 600; border: 1px solid #1a1a1a; display: flex; align-items: center; gap: 8px; }
        #resetBtn {
            position: absolute; bottom: 40px; padding: 12px 28px;
            background: transparent; color: #333; border: 1px solid #1a1a1a;
            border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }

        video, canvas { display: none; }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setupScreen">
        <div class="logo-box">
            <div class="logo-text">Rakaat</div>
            <div class="logo-sub">Smart Counter</div>
        </div>

        <div class="reminder-container">
            <div class="reminder-item"><span class="icon-emoji">💡</span> Gunakan di tempat bercahaya cukup, hindari ruang gelap atau silau langsung ke kamera.</div>
            <div class="reminder-item"><span class="icon-emoji">✈️</span> Aktifkan Mode Pesawat & Jangan Ganggu agar sholat lebih khusyuk.</div>
        </div>

        <div class="section-label">Pilih Suara</div>
        <div class="selector-group">
            <button class="selector-btn active" id="btnFemale"><i data-lucide="venus"></i> Perempuan</button>
            <button class="selector-btn" id="btnMale"><i data-lucide="mars"></i> Laki-Laki</button>
        </div>

        <div class="section-label">Pengaturan</div>
        <div class="option-row" id="muteToggle">
            <span><i data-lucide="volume-2" id="volIcon"></i> Suara</span>
            <div class="switch on" id="switchSound"></div>
        </div>

        <button id="checkLightBtn"><i data-lucide="sun"></i> Cek Pencahayaan</button>
        <button id="startBtn"><i data-lucide="play"></i> MULAI SHOLAT</button>
    </div>

    <!-- Light Check Modal -->
    <div id="lightModal">
        <div class="light-title"><i data-lucide="sun"></i> Cek Pencahayaan</div>
        <div class="light-bar-wrap">
            <div class="light-bar-bg">
                <div class="light-bar-track"></div>
                <div class="light-bar" id="lightBar"></div>
            </div>
        </div>
        <div class="light-val" id="lightValue">—</div>
        <div class="light-label" id="lightLabel">Aktifkan kamera...</div>
        <button class="light-stop-btn" id="lightStopBtn">Tutup</button>
    </div>

    <!-- App Screen -->
    <div id="appScreen">
        <div id="label">Rakaat</div>
        <div id="rakaat">1</div>
        <div class="status-pill"><i data-lucide="moon"></i> <span id="status">Sujud: 0</span></div>
        <button id="resetBtn"><i data-lucide="rotate-ccw"></i> Reset</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        let sujudCount = 0, rakaatCount = 1, isDark = false, isMuted = false, voiceGender = "female", wakeLock = null;
        let lightStream = null, lightAnimFrame = null;
        const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        const rakaatTeks = document.getElementById('rakaat'), statusTeks = document.getElementById('status');

        // TTS
        let voices = [];
        const loadV = () => { voices = window.speechSynthesis.getVoices(); };
        window.speechSynthesis.onvoiceschanged = loadV; loadV();

        function bicara(teks) {
            if (isMuted) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(teks);
            msg.lang = 'id-ID'; msg.rate = 0.9;
            const idV = voices.filter(v => v.lang.includes('id') || v.lang.includes('in'));
            if (voiceGender === "female") { if (idV[0]) msg.voice = idV[0]; msg.pitch = 1.1; }
            else { if (idV[1]) msg.voice = idV[1]; else if (idV[0]) msg.voice = idV[0]; msg.pitch = 0.7; }
            window.speechSynthesis.speak(msg);
        }

        // Gender
        document.getElementById('btnFemale').onclick = () => { 
            voiceGender = "female"; 
            document.getElementById('btnFemale').classList.add('active');
            document.getElementById('btnMale').classList.remove('active');
            bicara("Suara perempuan");
        };
        document.getElementById('btnMale').onclick = () => { 
            voiceGender = "male"; 
            document.getElementById('btnMale').classList.add('active');
            document.getElementById('btnFemale').classList.remove('active');
            bicara("Suara laki-laki");
        };

        // Mute
        document.getElementById('muteToggle').onclick = () => {
            isMuted = !isMuted;
            const sw = document.getElementById('switchSound');
            const volIcon = document.getElementById('volIcon');
            if (isMuted) {
                sw.classList.remove('on');
                volIcon.setAttribute('data-lucide', 'volume-x');
            } else {
                sw.classList.add('on');
                volIcon.setAttribute('data-lucide', 'volume-2');
                bicara("Suara aktif");
            }
            lucide.createIcons();
        };

        // Light check
        document.getElementById('checkLightBtn').onclick = async () => {
            try {
                lightStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = lightStream;
                document.getElementById('lightModal').classList.add('show');
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    measureLight();
                };
            } catch(e) { alert('Kamera error: ' + e.message); }
        };

        function measureLight() {
            if (!lightStream) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0, c = 0;
            for (let i = 0; i < d.length; i += 100) { t += (d[i] + d[i+1] + d[i+2]) / 3; c++; }
            const avg = Math.round(t / c);
            const pct = Math.min(Math.round(avg / 1.7), 100);

            document.getElementById('lightBar').style.width = pct + '%';
            document.getElementById('lightValue').textContent = avg;

            const lbl = document.getElementById('lightLabel');
            if (avg < 25) {
                document.getElementById('lightBar').style.background = '#e74c3c';
                document.getElementById('lightValue').style.color = '#e74c3c';
                lbl.innerHTML = '❌ Terlalu gelap — sensor tidak akurat';
                lbl.style.color = '#e74c3c';
            } else if (avg < 45) {
                document.getElementById('lightBar').style.background = '#f39c12';
                document.getElementById('lightValue').style.color = '#f39c12';
                lbl.innerHTML = '⚠️ Masih redup — coba tambah cahaya';
                lbl.style.color = '#f39c12';
            } else if (avg < 120) {
                document.getElementById('lightBar').style.background = '#2ecc71';
                document.getElementById('lightValue').style.color = '#2ecc71';
                lbl.innerHTML = '✅ Pencahayaan cukup — siap digunakan!';
                lbl.style.color = '#2ecc71';
            } else {
                document.getElementById('lightBar').style.background = '#3498db';
                document.getElementById('lightValue').style.color = '#3498db';
                lbl.innerHTML = '💡 Terang sekali — pastikan sinar tidak langsung ke kamera';
                lbl.style.color = '#3498db';
            }
            lightAnimFrame = requestAnimationFrame(measureLight);
        }

        document.getElementById('lightStopBtn').onclick = () => {
            if (lightAnimFrame) cancelAnimationFrame(lightAnimFrame);
            if (lightStream) { lightStream.getTracks().forEach(t => t.stop()); lightStream = null; }
            video.srcObject = null;
            document.getElementById('lightModal').classList.remove('show');
        };

        // Start
        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                if ('wakeLock' in navigator) try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                video.onloadedmetadata = () => { canvas.width = video.videoWidth; canvas.height = video.videoHeight; requestAnimationFrame(detect); };
                bicara("Mulai sholat");
            } catch(e) { alert("Kamera error: " + e.message); }
        }
        document.getElementById('startBtn').onclick = startApp;

        // Detection
        function detect() {
            if (video.paused || video.ended) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0, c = 0;
            for (let i = 0; i < d.length; i += 100) { t += (d[i] + d[i+1] + d[i+2]) / 3; c++; }
            const avg = t / c;
            if (avg < 25 && !isDark) { isDark = true; setTimeout(hit, 800); }
            else if (avg > 45 && isDark) isDark = false;
            setTimeout(() => requestAnimationFrame(detect), 300);
        }

        function hit() {
            sujudCount++; 
            if (navigator.vibrate) navigator.vibrate(200);
            statusTeks.innerText = "Sujud: " + sujudCount;
            if (sujudCount === 1) bicara("Sujud satu");
            else { 
                rakaatCount++; rakaatTeks.innerText = rakaatCount; bicara("Rakaat " + rakaatCount);
                sujudCount = 0; setTimeout(() => statusTeks.innerText = "Sujud: 0", 1000);
            }
        }

        document.getElementById('resetBtn').onclick = () => { sujudCount = 0; rakaatCount = 1; rakaatTeks.innerText = "1"; statusTeks.innerText = "Sujud: 0"; bicara("Reset"); };
    </script>
</body>
</html>
